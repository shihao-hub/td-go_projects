<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antigravity 配额 - agyquota</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <header class="masthead">
      <div class="brand">
        <svg class="gauge-mark" viewBox="0 0 48 48" aria-hidden="true">
          <circle cx="24" cy="24" r="19" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.28"></circle>
          <path d="M24 6v5M42 24h-5M24 42v-5M6 24h5" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.55"></path>
          <path d="M24 24 33 15" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"></path>
          <circle cx="24" cy="24" r="3.5" fill="currentColor"></circle>
        </svg>
        <div class="brand-text">
          <p class="eyebrow">AGYQUOTA / QUOTA INSTRUMENT</p>
          <h1>Antigravity 模型配额</h1>
        </div>
      </div>
      <div class="stamp" aria-label="上次查询与构建信息">
        <div class="last-query">
          <span class="stamp-label">上次查询</span>
          <strong class="last-time" id="lastTime">尚未查询</strong>
          <span class="last-ago" id="lastAgo"></span>
        </div>
        <div class="stamp-meta">
          <span class="chip" id="channel">—</span>
          <span class="version" id="version">—</span>
        </div>
      </div>
    </header>

    <section class="controls" aria-label="查询控制">
      <div class="segmented" id="sourceTabs" role="tablist" aria-label="数据源">
        <button type="button" role="tab" data-source="agy" class="active" aria-selected="true">Antigravity CLI</button>
        <button type="button" role="tab" data-source="zed" aria-selected="false">Zed 插件</button>
      </div>
      <div class="controls-right">
        <label class="toggle" title="每 60 秒自动重新查询">
          <input type="checkbox" id="autoRefresh">
          <span>60s 自动刷新</span>
        </label>
        <button type="button" class="btn ghost" id="rawBtn">原始响应</button>
        <button type="button" class="btn primary" id="refreshBtn">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path>
            <path d="M13.5 2.5V5H11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
          查询
        </button>
      </div>
    </section>

    <section class="statusbar" aria-live="polite">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">正在准备…</span>
      <span class="spacer"></span>
      <span class="fetched" id="fetchedAt"></span>
    </section>

    <main id="content" class="content">
      <div class="skeleton" aria-hidden="true">
        <div class="skeleton-line w40"></div>
        <div class="skeleton-line"></div>
        <div class="skeleton-line w80"></div>
      </div>
    </main>

    <footer class="meta-row" id="metaRow" hidden>
      <div class="meta-item">
        <span class="meta-label">数据源</span>
        <span class="meta-value" id="metaSource">—</span>
      </div>
      <div class="meta-item" id="accountItem" hidden>
        <span class="meta-label">账号</span>
        <span class="meta-value" id="metaAccount">—</span>
      </div>
      <div class="meta-item" id="tokenItem" hidden>
        <span class="meta-label">Access Token</span>
        <span class="meta-value" id="metaToken">—</span>
      </div>
      <div class="meta-item meta-grow">
        <span class="meta-label">数据目录</span>
        <span class="meta-value mono" id="metaDataDir">—</span>
      </div>
    </footer>
  </div>

  <dialog id="rawDialog" class="raw-dialog">
    <div class="raw-head">
      <div>
        <p class="eyebrow">RAW RESPONSE</p>
        <h2 id="rawTitle">接口原始响应</h2>
      </div>
      <button type="button" class="btn ghost" id="rawClose">关闭</button>
    </div>
    <pre id="rawBody" class="raw-body">正在读取…</pre>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
