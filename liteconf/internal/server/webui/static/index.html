<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>liteconf · 配置中心</title>
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
<header class="masthead">
  <a class="brand" href="#/">
    <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
      <rect x="3" y="3" width="18" height="18" rx="4"></rect>
      <path d="M7.5 8.5h9M7.5 12h6M7.5 15.5h9"></path>
    </svg>
    <span class="brand-text">
      <span class="brand-name">liteconf</span>
      <span class="brand-sub">配置中心</span>
    </span>
  </a>
  <div class="masthead-actions">
    <span class="masthead-note">内网可信环境 · 文件即数据库</span>
    <button id="btn-new" class="btn btn-primary" type="button">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.5v9M3.5 8h9"></path></svg>
      新建配置
    </button>
  </div>
</header>

<div id="error-banner" class="hidden" role="alert"></div>

<main>
  <section id="list-view" class="hidden"></section>

  <section id="editor-view" class="hidden">
    <a class="back-link" href="#/">← 返回配置目录</a>

    <div class="editor-head">
      <h2 id="editor-title"></h2>
      <p id="editor-version"></p>
    </div>

    <div id="not-found" class="hidden"></div>

    <div id="editor-body">
      <div class="mode-switch" role="tablist" aria-label="编辑模式">
        <button id="btn-mode-text" class="btn btn-tab" type="button" role="tab">JSON 文本</button>
        <button id="btn-mode-table" class="btn btn-tab" type="button" role="tab">键值表</button>
      </div>

      <div id="text-pane">
        <textarea id="json-text" rows="18" spellcheck="false" aria-label="JSON 文本"></textarea>
        <div class="editor-actions">
          <button id="btn-format" class="btn btn-ghost" type="button">格式化</button>
          <button id="btn-save" class="btn btn-primary" type="button">保存</button>
          <span id="editor-status"></span>
        </div>
      </div>

      <div id="table-pane" class="hidden">
        <div class="table-wrap">
          <table id="kv-table">
            <thead>
              <tr><th>键路径</th><th>值（数组/复杂值为 JSON 片段）</th></tr>
            </thead>
            <tbody id="table-body"></tbody>
          </table>
        </div>
        <div class="editor-actions">
          <button id="btn-save-table" class="btn btn-primary" type="button">保存</button>
          <span id="table-status"></span>
        </div>
      </div>
    </div>
  </section>
</main>

<dialog id="new-dialog">
  <h3>新建配置</h3>
  <p class="dialog-hint">配置会立刻落成 <code>configs/{app}/{env}.json</code>，后续直接用编辑器改文件也会被感知。</p>
  <div id="new-error" class="dialog-error hidden"></div>
  <label>app <input id="new-app" type="text" placeholder="如 taskmon" autocomplete="off"></label>
  <label>env <input id="new-env" type="text" placeholder="如 dev" autocomplete="off"></label>
  <label>初始 JSON <textarea id="new-json" rows="8" spellcheck="false">{}</textarea></label>
  <div class="dialog-actions">
    <button id="btn-new-cancel" class="btn btn-ghost" type="button">取消</button>
    <button id="btn-new-submit" class="btn btn-primary" type="button">创建</button>
  </div>
</dialog>
</body>
</html>
