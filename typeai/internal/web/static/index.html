<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>typeai</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <div class="brand">typeai</div>
        <button class="icon-btn" id="new-session" title="新建会话">＋</button>
      </div>
      <div class="sidebar-sub-row">
        <span class="sidebar-sub">会话</span>
        <div class="sidebar-view-toggle">
          <button type="button" class="view-mode-btn active" id="view-mode-tree" title="分类树状视图">树状</button>
          <button type="button" class="view-mode-btn" id="view-mode-list" title="时间平铺视图">平铺</button>
        </div>
      </div>
      <div class="session-list" id="session-list"></div>
      <div class="sidebar-foot">
        <button class="text-btn" id="open-settings">连接设置</button>
        <div class="channel" id="channel"></div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="tabs" id="tabs"></div>
        <div class="top-meta" id="top-meta"></div>
      </header>

      <div class="error-bar" id="error-bar" hidden></div>

      <section class="transcript" id="transcript"></section>

      <footer class="composer">
        <div class="attachments" id="attachments" hidden></div>
        <div class="composer-box">
          <textarea id="input" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
          <div class="composer-actions">
            <button class="icon-btn" id="pick-image" title="添加图片">▧</button>
            <input type="file" id="file-input" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden>
            <span class="hint" id="hint"></span>
            <button class="send-btn" id="send">发送</button>
            <button class="send-btn danger" id="cancel" hidden>取消</button>
          </div>
        </div>
      </footer>
    </main>
  </div>

  <div class="context-menu" id="session-context-menu" hidden></div>

  <dialog id="session-modal">
    <form method="dialog" class="settings-form" id="session-modal-form">
      <h2 id="session-modal-title">编辑会话属性</h2>
      <label class="checkbox-row">
        <input type="checkbox" id="sess-pinned">
        <span>置顶此会话</span>
      </label>
      <div class="form-field">
        <span class="field-label">标签分类</span>
        <div class="tag-pills-box" id="tag-pills-box">
          <div class="tag-pills-list" id="tag-pills-list"></div>
          <input type="text" id="tag-pill-input" class="tag-pill-input" placeholder="+ 添加新标签 (Enter 创建)..." autocomplete="off">
        </div>
        <div class="tag-pool-section">
          <div class="tag-pool-header">
            <span class="tag-pool-title">全库标签池</span>
            <span class="tag-pool-tip">点击快速添加 / 取消</span>
          </div>
          <div class="tag-pool-chips" id="tag-pool-chips"></div>
        </div>
      </div>
      <label>
        截止时间 (Due Date)
        <div class="date-row">
          <input type="date" id="sess-due-date">
          <button type="button" class="mini-btn" id="sess-clear-due">清除</button>
        </div>
      </label>
      <div class="settings-actions">
        <button type="button" class="text-btn" id="session-modal-cancel">取消</button>
        <button type="submit" class="send-btn" id="session-modal-save">保存</button>
      </div>
    </form>
  </dialog>

  <dialog id="settings">
    <form method="dialog" class="settings-form" id="settings-form">
      <h2>连接设置</h2>
      <label>Base URL<input id="cfg-base-url" placeholder="https://api.openai.com/v1"></label>
      <label>模型<input id="cfg-model" placeholder="gpt-4o-mini"></label>
      <label>API Key<input id="cfg-api-key" type="password" placeholder="留空表示保持现有密钥"></label>
      <p class="cfg-note" id="cfg-note"></p>
      <div class="settings-actions">
        <button type="button" class="text-btn" id="settings-cancel">取消</button>
        <button type="submit" class="send-btn" id="settings-save">保存</button>
      </div>
    </form>
  </dialog>

  <script src="/app.js"></script>
</body>
</html>
