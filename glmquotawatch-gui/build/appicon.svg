<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- GLM Quota Watch Modern Desktop App Icon (1024x1024) -->
  <!-- Designed for Windows Desktop & 16px System Tray Presence -->
  
  <defs>
    <!-- Crisp developer tool color palette -->
    <!-- Base: Slate-900 (#0F172A), Border: Slate-800 (#1E293B) -->
    <!-- Active Arc: Electric Cyan (#00F0FF), Warning Segment: Vibrant Coral (#FF5C4D) -->
  </defs>

  <!-- Deep Slate Squircle Base (Transparent Background Outside) -->
  <rect x="72" y="72" width="880" height="880" rx="200" ry="200" fill="#0F172A" stroke="#1E293B" stroke-width="14" />

  <!-- Background Track Ring (Remaining 30% Capacity / Slate-800) -->
  <circle cx="512" cy="512" r="295" fill="none" stroke="#1E293B" stroke-width="90" />

  <!-- Electric Cyan Arc (0% to 52% Quota Usage) -->
  <!-- Circumference = 2 * pi * 295 = 1853.54px -->
  <!-- 52% = 963.84px -->
  <circle cx="512" cy="512" r="295" fill="none" stroke="#00F0FF" stroke-width="90"
          stroke-dasharray="963.84 889.70" stroke-linecap="round"
          transform="rotate(-90 512 512)" />

  <!-- Vibrant Coral Warning Arc (52% to 70% Quota Usage - Alert Threshold) -->
  <!-- 18% = 333.64px, Rotated to 97.2 degrees (-90 + 0.52 * 360) -->
  <circle cx="512" cy="512" r="295" fill="none" stroke="#FF5C4D" stroke-width="90"
          stroke-dasharray="333.64 1519.90" stroke-linecap="round"
          transform="rotate(97.2 512 512)" />
</svg>
