function joinPath(dir,name){return dir.endsWith("\\")?dir+name:dir+"\\"+name}
function parentDir(p){const parts=p.split("\\").filter(Boolean);if(parts.length<=1)return parts[0]+"\\";parts.pop();return parts.join("\\")}
function dirName(p){const q=p.replace(/\\+$/,"");const i=q.lastIndexOf("\\");return i<0?q:(i<=2?q.slice(0,i+1):q.slice(0,i))}
function baseName(p){return p.replace(/\\+$/,"").split("\\").pop()}
function exeBaseName(path){return baseName(path).replace(/\.exe$/i,"")}
function normPath(p){return p.replace(/\\+/g,"\\").replace(/\\$/,"")||p}
function samePath(a,b){return normPath(a).toLowerCase()===normPath(b).toLowerCase()}

function fsNode(path){
  let node=MOCK_FS;
  for(const part of path.split("\\").filter(Boolean)){
    if(!node||typeof node!=="object")return null;
    const key=Object.keys(node).find(k=>k.toLowerCase()===part.toLowerCase());
    if(!key)return null;
    node=node[key];
  }
  return node;
}

function fsListDir(path){
  const node=fsNode(path);
  if(!node)return [];
  const dirs=[],files=[];
  for(const name of Object.keys(node)){
    if(/\.exe$/i.test(name))files.push(name);else dirs.push(name);
  }
  dirs.sort((a,b)=>a.localeCompare(b,"zh"));
  files.sort((a,b)=>a.localeCompare(b,"zh"));
  return [...dirs.map(n=>({name:n,type:"dir"})),...files.map(n=>({name:n,type:"file"}))];
}

function fsFileExists(path){
  const base=baseName(path);
  if(!/\.exe$/i.test(base))return false;
  const node=fsNode(dirName(path));
  if(!node)return false;
  return Object.keys(node).some(k=>k.toLowerCase()===base.toLowerCase());
}

function fsWalkExe(root){
  const files=[],skipped=new Set();
  (function walk(dir){
    const node=fsNode(dir);
    if(!node)return;
    for(const name of Object.keys(node)){
      const p=joinPath(dir,name);
      if(/\.exe$/i.test(name)){files.push(p)}
      else{
        if(NOISE.has(name.toLowerCase())){skipped.add(name);continue}
        walk(p);
      }
    }
  })(root);
  files.sort();
  return {files,skipped};
}

function buildInitial(){
  return INITIAL.map(([name,path,addedAt])=>({name,path,addedAt,valid:fsFileExists(path)}));
}

function addEntry(name,path){
  if(!path)return false;
  path=normPath(path);
  if(entries.some(e=>samePath(e.path,path)))return false;
  if(!name)name=exeBaseName(path);
  entries.push({name,path,addedAt:new Date().toISOString(),valid:fsFileExists(path)});
  return true;
}

function refreshValid(){entries.forEach(e=>e.valid=fsFileExists(e.path))}
function invalidCount(){return entries.filter(e=>!e.valid).length}

function escHtml(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}

function inlineMd(s){
  return s
    .replace(/\*\*([\s\S]+?)\*\*/g,(_,t)=>"<b>"+inlineMd(t)+"</b>")
    .replace(/`([^`]+?)`/g,"<code>$1</code>")
    .replace(/\[([^\]]*?)\]\(([^()]*?)\)/g,(_,label,url)=>'<a>'+label+(url&&url!==label?'<span class="md-url"> ('+url+')</span>':'')+"</a>")
    .replace(/\*([\s\S]+?)\*/g,(_,t)=>"<i>"+inlineMd(t)+"</i>");
}

function mdToHtml(src){
  const lines=src.replace(/\r\n/g,"\n").split("\n");
  const out=[];
  let inCode=false,code=[],listType=null;
  const closeList=()=>{if(listType){out.push("</"+listType+">");listType=null}};
  const openList=t=>{if(listType!==t){closeList();out.push("<"+t+">");listType=t}};
  for(const ln of lines){
    if(/^```/.test(ln)){
      if(inCode){out.push("<pre>"+escHtml(code.join("\n"))+"</pre>");code=[]}
      inCode=!inCode;
      continue;
    }
    if(inCode){code.push(ln);continue}
    if(ln===""){closeList();continue}
    if(/^(-{3,}|\*{3,}|_{3,})$/.test(ln)){closeList();out.push("<hr>");continue}
    let m=ln.match(/^(#{1,6}) (.*)$/);
    if(m){closeList();const n=m[1].length;out.push(`<h${n}>${inlineMd(escHtml(m[2]))}</h${n}>`);continue}
    if(ln[0]===">"){closeList();out.push("<blockquote>"+inlineMd(escHtml(ln.replace(/^>\s?/,"")))+"</blockquote>");continue}
    m=ln.match(/^[-*+] (.*)$/);
    if(m){openList("ul");out.push("<li>"+inlineMd(escHtml(m[1]))+"</li>");continue}
    m=ln.match(/^(\d{1,3}\.) (.*)$/);
    if(m){openList("ol");out.push("<li>"+inlineMd(escHtml(m[2]))+"</li>");continue}
    closeList();
    out.push("<p>"+inlineMd(escHtml(ln))+"</p>");
  }
  if(inCode&&code.length)out.push("<pre>"+escHtml(code.join("\n"))+"</pre>");
  closeList();
  return out.join("\n");
}

function selectedEntry(){return selected>=0&&selected<entries.length?entries[selected]:null}

function ensureEntryValid(e){
  if(e.valid)return true;
  msgBox("文件不存在","该文件已失效：\n"+e.path,"warn").then(()=>{
    refreshValid();
    renderAll();
  });
  return false;
}

function defaultPickDir(){
  if(lastScanDir)return lastScanDir;
  if(entries.length)return dirName(entries[0].path);
  return "C:\\";
}

async function onCommand(cmd){
  if(!running)return;
  switch(cmd){
    case "addExe":{
      const path=await openFileDialog(defaultPickDir());
      if(!path)return;
      if(addEntry("",path)){
        renderAll();
        logToast([`添加条目: ${path}`]);
      }else{
        msgBox("已存在","该 EXE 已在列表中：\n"+path,"info");
      }
      break;
    }
    case "scanDir":{
      const root=await folderDialog(lastScanDir||"C:\\");
      if(!root)return;
      lastScanDir=root;
      await scanProgress(root);
      const {files,skipped}=fsWalkExe(root);
      if(!files.length){
        msgBox("扫描完成","未在该目录找到任何 exe。","info");
        return;
      }
      const chosen=await scanDialog(files,skipped);
      if(!chosen||!chosen.length)return;
      let n=0;
      for(const p of chosen){if(addEntry("",p))n++}
      renderAll();
      logToast([`扫描 ${root}: 命中 ${files.length} 个 exe（跳过噪音目录 ${[...skipped].join("、")||"无"}）`,`导入 ${n} 条新条目（勾选 ${chosen.length} 条，重复自动跳过）`],5200);
      break;
    }
    case "launch":{
      const e=selectedEntry();
      if(!e)return;
      if(!ensureEntryValid(e))return;
      logToast([`启动 exe: "${e.path}" (工作目录 "${dirName(e.path)}")`,`启动 exe 成功 (ShellExecute)`]);
      break;
    }
    case "openDir":{
      const e=selectedEntry();
      if(!e)return;
      if(!ensureEntryValid(e))return;
      logToast([`打开目录: explorer /select,"${e.path}"`]);
      break;
    }
    case "powerShell":{
      const e=selectedEntry();
      if(!e)return;
      if(!ensureEntryValid(e))return;
      logToast([`打开 PowerShell: shell="pwsh" dir="${dirName(e.path)}"`,`PowerShell 已启动 (ShellExecute)`]);
      break;
    }
    case "mdDoc":{
      const e=selectedEntry();
      if(!e)return;
      const key=exeBaseName(e.path);
      const md=MD_DOCS[key];
      if(md===undefined){
        msgBox("未找到介绍文件",`未找到同名介绍文件：\n${dirName(e.path)}\\${key}.md`,"info");
      }else{
        logToast([`查看介绍: "${dirName(e.path)}\\${key}.md"`],2600);
        await mdWindow(e.name,md);
      }
      break;
    }
    case "remove":{
      if(selected<0)return;
      const e=entries[selected];
      entries.splice(selected,1);
      renderAll();
      logToast([`移除条目: ${e.name} (${e.path})`],3000);
      break;
    }
    case "cleanInvalid":{
      const n=invalidCount();
      if(!n){toast("没有失效条目需要清理",2600);return}
      entries=entries.filter(e=>e.valid);
      renderAll();
      logToast([`清理失效: 移除 ${n} 条`]);
      break;
    }
    case "refresh":{
      refreshValid();
      renderAll();
      logToast([`刷新完成: 共 ${entries.length} 项，${invalidCount()} 项失效`],3000);
      break;
    }
  }
}

});

lvBody.addEventListener("dblclick",e=>{
  if(e.target.closest(".lv-row"))onCommand("launch");
});

$("#listview").addEventListener("contextmenu",e=>{
  const r=e.target.closest(".lv-row");
  if(r)selectRow(+r.dataset.i);
  const en=selected>=0;
  const x=e.clientX,y=e.clientY;
  showMenu(x,y,[
    {label:"启动",enabled:en,action:()=>onCommand("launch")},
    {label:"打开目录",enabled:en,action:()=>onCommand("openDir")},
    {label:"在此目录开 PowerShell",enabled:en,action:()=>onCommand("powerShell")},
    {label:"查看介绍",enabled:en,action:()=>onCommand("mdDoc")},
    {sep:true},
    {label:"移除",enabled:en,action:()=>onCommand("remove")}
  ]);
});

const appWindow=$("#appWindow"),taskBtn=$("#taskBtn"),trayIcon=$("#trayIcon");
let trayHintShown=false,maxSaved=null;

(function(){
  const tb=$("#mainTitlebar");
  let drag=false,sx=0,sy=0,ox=0,oy=0;
  tb.addEventListener("mousedown",e=>{
    if(e.target.closest(".win-ctl")||appWindow.classList.contains("max"))return;
    drag=true;sx=e.clientX;sy=e.clientY;ox=appWindow.offsetLeft;oy=appWindow.offsetTop;
    e.preventDefault();
  });
  document.addEventListener("mousemove",e=>{
    if(!drag)return;
    appWindow.style.left=Math.max(-appWindow.offsetWidth+140,Math.min(innerWidth-80,ox+e.clientX-sx))+"px";
    appWindow.style.top=Math.max(0,Math.min(innerHeight-90,oy+e.clientY-sy))+"px";
  });
  document.addEventListener("mouseup",()=>drag=false);
})();

$("#btnMax").onclick=()=>{
  if(appWindow.classList.contains("max")){
    appWindow.classList.remove("max");
    Object.assign(appWindow.style,maxSaved);
  }else{
    maxSaved={left:appWindow.style.left,top:appWindow.style.top,width:appWindow.style.width,height:appWindow.style.height};
    appWindow.classList.add("max");
    Object.assign(appWindow.style,{left:"0",top:"0",width:"100vw",height:"calc(100vh - 40px)"});
  }
};

function showMain(){
  appWindow.classList.remove("hidden");
  taskBtn.classList.add("active");
}

function hideMain(){
  appWindow.classList.add("hidden");
  taskBtn.classList.remove("active");
}

$("#btnMin").onclick=hideMain;

$("#btnClose").onclick=()=>{
  hideMain();
  if(!trayHintShown){
    trayHintShown=true;
    toast("窗口已隐藏到托盘：点击任务栏右侧托盘图标恢复（右击有菜单，可退出）",5600);
  }
};

taskBtn.onclick=()=>{
  if(!running)return;
  if(appWindow.classList.contains("hidden"))showMain();
  else hideMain();
};

trayIcon.addEventListener("click",()=>{if(running)showMain()});

trayIcon.addEventListener("contextmenu",e=>{
  if(!running)return;
  showMenu(e.clientX,e.clientY,[
    {label:"打开主窗口",action:showMain},
    {sep:true},
    {label:"退出",action:exitApp}
  ]);
});

function exitApp(){
  running=false;
  hideMain();
  trayIcon.classList.add("hidden");
  taskBtn.classList.add("hidden");
  toast("程序已退出 · 双击桌面图标可重新启动",5000);
}

function launchApp(){
  entries=buildInitial();
  lastScanDir="";
  running=true;
  renderAll();
  trayIcon.classList.remove("hidden");
  taskBtn.classList.remove("hidden");
  appWindow.classList.remove("max");
  const w=Math.min(980,innerWidth-24),h=Math.min(620,innerHeight-64);
  appWindow.style.width=w+"px";
  appWindow.style.height=h+"px";
  appWindow.style.left=Math.max(8,Math.round((innerWidth-w)/2))+"px";
  appWindow.style.top=Math.max(8,Math.round((innerHeight-40-h)/2))+"px";
  showMain();
  logToast([
    `启动: 日志文件 C:\\Users\\demo\\AppData\\Roaming\\exe-launcher\\exe-launcher.log`,
    `持有单例 Mutex (mutex=Local\\exe-launcher-singleton)`,
    `托盘已注册`
  ],5200);
  toast("欢迎体验 HTML Demo：数据全为 mock，试试右键行、扫描目录、查看介绍，以及关闭到托盘",6500);
}

const desktopIcon=$("#desktopIcon");
desktopIcon.addEventListener("click",()=>desktopIcon.classList.add("sel"));
document.addEventListener("mousedown",e=>{if(!desktopIcon.contains(e.target))desktopIcon.classList.remove("sel")});
desktopIcon.addEventListener("dblclick",()=>{
  if(running){
    msgBox("EXE 启动器","程序已在运行，请勿重复启动。","warn").then(()=>{
      if(running)showMain();
    });
  }else{
    launchApp();
  }
});

(function(){
  const t=$("#clockTime"),d=$("#clockDate");
  const p=n=>String(n).padStart(2,"0");
  function tick(){
    const n=new Date();
    t.textContent=`${p(n.getHours())}:${p(n.getMinutes())}`;
    d.textContent=`${n.getFullYear()}/${p(n.getMonth()+1)}/${p(n.getDate())}`;
  }
  tick();
  setInterval(tick,1000);
})();

launchApp();
</script>
</body>
</html>
